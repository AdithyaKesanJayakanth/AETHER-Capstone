% ---------------------------------------------------------------------------
% Project AETHER - SU2 v8.5.0 configuration template
% Laminar compressible Navier-Stokes, calorically perfect air, isothermal wall.
% Rendered by aether/su2config.py; curly-brace fields are substituted per case.
% ---------------------------------------------------------------------------
SOLVER= NAVIER_STOKES
KIND_TURB_MODEL= NONE
MATH_PROBLEM= DIRECT
RESTART_SOL= {restart_sol}
AXISYMMETRIC= {axisymmetric}
SYSTEM_MEASUREMENTS= SI
%
% ---- Free-stream (dimensional; density from p, T and the gas model) --------
MACH_NUMBER= {mach}
AOA= 0.0
SIDESLIP_ANGLE= 0.0
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= {p_inf}
FREESTREAM_TEMPERATURE= {T_inf}
REF_DIMENSIONALIZATION= DIMENSIONAL
%
% ---- Gas and transport models ---------------------------------------------
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058
VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716E-5
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
%
% ---- Reference values for force coefficients ------------------------------
REF_ORIGIN_MOMENT_X= 0.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= {ref_length}
REF_AREA= {ref_area}
%
% ---- Boundary conditions --------------------------------------------------
MARKER_ISOTHERMAL= ( wall, {T_wall} )
{bc_lines}
MARKER_PLOTTING= ( wall )
MARKER_MONITORING= ( wall )
%
% ---- Numerics -------------------------------------------------------------
NUM_METHOD_GRAD= GREEN_GAUSS
NUM_METHOD_GRAD_RECON= LEAST_SQUARES
CONV_NUM_METHOD_FLOW= {conv_scheme}
USE_ACCURATE_FLUX_JACOBIANS= YES
MUSCL_FLOW= {muscl}
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= {venkat}
LIMITER_ITER= 999999
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= {cfl}
CFL_ADAPT= {cfl_adapt}
CFL_ADAPT_PARAM= ( 0.5, 1.2, {cfl_min}, {cfl_max}, 1e-3, 0 )
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 30
ITER= {iter}
%
% ---- Convergence ----------------------------------------------------------
% Residuals plateau at strong shocks with limited upwind schemes; the run is
% stopped when the integrated quantities are stationary (Cauchy criterion over
% CONV_CAUCHY_ELEMS iterations) or when ITER is reached, whichever is first.
CONV_FIELD= ( DRAG, MAXIMUM_HEATFLUX )
CONV_CAUCHY_ELEMS= 500
CONV_CAUCHY_EPS= {cauchy_eps}
CONV_RESIDUAL_MINVAL= {conv_resid}
CONV_STARTITER= 500
%
% ---- Input / output -------------------------------------------------------
MESH_FILENAME= {mesh}
MESH_FORMAT= SU2
SOLUTION_FILENAME= {solution_in}
RESTART_FILENAME= {restart_out}
TABULAR_FORMAT= CSV
CONV_FILENAME= {history}
VOLUME_FILENAME= {volume}
SURFACE_FILENAME= {surface}
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )
OUTPUT_WRT_FREQ= {wrt_freq}
% volume snapshots are kept (not overwritten) so that the stationarity of the wall
% heat flux can be checked between the last two snapshots (aether/postproc.py)
WRT_VOLUME_OVERWRITE= NO
WRT_FORCES_BREAKDOWN= YES
BREAKDOWN_FILENAME= {breakdown}
SCREEN_WRT_FREQ_INNER= 50
HISTORY_WRT_FREQ_INNER= 1
SCREEN_OUTPUT= ( INNER_ITER, WALL_TIME, RMS_DENSITY, RMS_ENERGY, LIFT, DRAG, TOTAL_HEATFLUX, MAXIMUM_HEATFLUX, AVG_CFL )
HISTORY_OUTPUT= ( ITER, WALL_TIME, RMS_RES, AERO_COEFF, HEAT, LINSOL, CFL_NUMBER )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE, RESIDUAL )
